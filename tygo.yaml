# TypeScript types generated from this store's Go wire types. The Go structs
# are the source of truth; ts/ is a render of them. Regenerate with
# ./generate-ts.sh after changing a wire type. Only the files that declare
# wire types are read; the rest hold internals.
packages:
  - path: "github.com/kayushkin/project-store"
    output_path: "ts/model.ts"
    include_files:
      - "store.go"
      - "rollup.go"
      - "vocabulary.go"
